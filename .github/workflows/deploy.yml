name: Deploy ClinicForce application

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'testing/**'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'hapi/**'
      - 'testing/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: clinicforce-production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '311057178360'
  STACK_NAME: clinicforce-production

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: clinicforce_test
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: stafftest
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clinicforce_test -d stafftest"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STAFF_TEST_DATABASE_URL: postgresql://clinicforce_test:synthetic-ci-password@localhost:5432/stafftest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate backend source
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r backend/requirements.txt pytest
          .venv/bin/python -m compileall -q backend/app
          .venv/bin/python -m pytest -q -c testing/pytest.ini testing

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          node ../testing/test-card-capture.mjs
          npm run lint
          npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::311057178360:role/clinicforce-github-actions-deploy-managed
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and publish immutable application images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --pull --tag "$REGISTRY/clinicforce-backend:$IMAGE_TAG" backend
          docker build --pull --tag "$REGISTRY/clinicforce-hapi:$IMAGE_TAG" hapi
          docker push "$REGISTRY/clinicforce-backend:$IMAGE_TAG"
          docker push "$REGISTRY/clinicforce-hapi:$IMAGE_TAG"

      - name: Update only the released image parameters
        id: release_stack
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Infrastructure releases run in a separate repository. Let an active
          # stack update finish before reading and preserving its parameters.
          stack_status=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' --output text)
          if [[ "$stack_status" == *_IN_PROGRESS ]]; then
            aws cloudformation wait stack-update-complete --stack-name "$STACK_NAME"
          fi
          # Preserve every existing integration parameter, including newly added secrets.
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Parameters[].ParameterKey' --output json > /tmp/clinicforce-parameter-keys.json
          jq --arg backend "$REGISTRY/clinicforce-backend:$IMAGE_TAG" \
             --arg hapi "$REGISTRY/clinicforce-hapi:$IMAGE_TAG" \
             'map(if . == "BackendImageUri" then {ParameterKey: ., ParameterValue: $backend}
                  elif . == "HapiImageUri" then {ParameterKey: ., ParameterValue: $hapi}
                  else {ParameterKey: ., UsePreviousValue: true} end)' \
             /tmp/clinicforce-parameter-keys.json > /tmp/clinicforce-release-parameters.json
          aws cloudformation update-stack \
            --stack-name "$STACK_NAME" \
            --use-previous-template \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameters file:///tmp/clinicforce-release-parameters.json
          aws cloudformation wait stack-update-complete --stack-name "$STACK_NAME"
          aws ecs wait services-stable --cluster clinicforce-production --services backend hapi

      - name: Report stack rollback details
        if: ${{ failure() && steps.release_stack.outcome == 'failure' }}
        run: |
          set +e
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].{status:StackStatus,reason:StackStatusReason}' \
            --output table
          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --max-items 40 \
            --query 'StackEvents[?contains(ResourceStatus, `FAILED`) || contains(ResourceStatus, `ROLLBACK`)].{time:Timestamp,resource:LogicalResourceId,type:ResourceType,status:ResourceStatus,reason:ResourceStatusReason}' \
            --output table
          for service in backend hapi; do
            echo "Stopped tasks for $service"
            task_arns=$(aws ecs list-tasks --cluster clinicforce-production --service-name "$service" --desired-status STOPPED --query 'taskArns' --output text)
            if [ -n "$task_arns" ] && [ "$task_arns" != "None" ]; then
              aws ecs describe-tasks --cluster clinicforce-production --tasks $task_arns \
                --query 'tasks[].{task:taskArn,stopped:stoppedReason,containers:containers[].{name:name,reason:reason,exit:exitCode}}' \
                --output json
            fi
          done

      - name: Build and publish frontend assets
        id: frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build
          echo "bucket=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs[?OutputKey==`StaticBucketName`].OutputValue' --output text)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs[?OutputKey==`DistributionId`].OutputValue' --output text)" >> "$GITHUB_OUTPUT"

      - name: Publish frontend and invalidate CloudFront
        working-directory: frontend
        env:
          STATIC_BUCKET: ${{ steps.frontend.outputs.bucket }}
          DISTRIBUTION_ID: ${{ steps.frontend.outputs.distribution }}
        run: |
          set -euo pipefail
          test -n "$STATIC_BUCKET"
          test -n "$DISTRIBUTION_ID"
          aws s3 sync dist/ "s3://$STATIC_BUCKET/" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*'
