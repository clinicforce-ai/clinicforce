name: Deploy ClinicForce application
run-name: Release ${{ inputs.environment || 'staging' }} ${{ inputs.request_id || github.sha }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
        required: true
      staging_run_id:
        description: Successful main-branch staging run to promote unchanged
        type: string
      verification_reference:
        description: Required for production; reference to successful representative workflow checks (no patient data)
        type: string
      request_id:
        description: Deployment CLI correlation ID
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: clinicforce-${{ github.event_name == 'pull_request' && github.ref || inputs.environment || 'staging' }}-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: clinicforce_test
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: stafftest
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clinicforce_test -d stafftest"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STAFF_TEST_DATABASE_URL: postgresql://clinicforce_test:synthetic-ci-password@localhost:5432/stafftest
    steps:
      - uses: actions/checkout@v4

      - name: Scan credentials before release
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro"
          zricethezav/gitleaks:v8.21.2 detect --source=/repo --no-git --redact --exit-code=1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check deployment safety
        run: python3 -m unittest discover -s scripts -p "test_*.py"

      - name: Validate backend source
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r backend/requirements.txt pytest
          .venv/bin/python -m compileall -q backend/app
          .venv/bin/python -m pytest -q -c testing/pytest.ini testing

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          node ../testing/test-card-capture.mjs
          node ../testing/test-healow-review.mjs
          npm run lint
          npm run build


  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.environment != 'production'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::311057178360:role/clinicforce-github-actions-staging-deploy
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build release once and resolve image digests
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p release
          for service in backend hapi; do
            repository="clinicforce-staging-$service"
            docker build --progress=plain --pull --tag "$REGISTRY/$repository:$IMAGE_TAG" "$service"
            docker push "$REGISTRY/$repository:$IMAGE_TAG"
            digest=$(aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
            echo "$REGISTRY/$repository@$digest" > "release/$service-image"
          done
          jq -n --arg sha "$GITHUB_SHA" --arg backend "$(cat release/backend-image)" --arg hapi "$(cat release/hapi-image)" \
            '{sha:$sha,backend:$backend,hapi:$hapi}' > release/manifest.json
          cd frontend
          npm ci
          npm run build
          cp -r dist ../release/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deploy ${{ inputs.environment || 'staging' }}
    if: >-
      always() && needs.verify.result == 'success' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (needs.build.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'production'))
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment || 'staging' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Enforce production verification and staging provenance
        if: inputs.environment == 'production'
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN: ${{ inputs.staging_run_id }}
          VERIFICATION_REFERENCE: ${{ inputs.verification_reference }}
        run: |
          set -euo pipefail
          test -n "${VERIFICATION_REFERENCE//[[:space:]]/}" || { echo 'Successful workflow verification is required'; exit 1; }
          python3 scripts/check_release.py "$STAGING_RUN"
      - uses: actions/download-artifact@v4
        if: inputs.environment != 'production'
        with:
          name: release
          path: release
      - uses: actions/download-artifact@v4
        if: inputs.environment == 'production'
        with:
          name: release
          path: release
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ github.token }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'production' && 'arn:aws:iam::311057178360:role/clinicforce-github-actions-deploy-managed' || 'arn:aws:iam::311057178360:role/clinicforce-github-actions-staging-deploy' }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Release images and frontend, watch AWS progress, verify result
        env:
          TARGET: ${{ inputs.environment || 'staging' }}
          RELEASE_SHA: ${{ steps.promotion.outputs.sha || github.sha }}
          STAGING_SMOKE_PASSWORD: ${{ inputs.environment != 'production' && secrets.STAGING_SMOKE_PASSWORD || '' }}
        run: python3 scripts/release.py "$TARGET" --sha "$RELEASE_SHA"
      - name: Publish release summary
        if: always()
        env:
          TARGET: ${{ inputs.environment || 'staging' }}
          RELEASE_SHA: ${{ steps.promotion.outputs.sha || github.sha }}
          STAGING_RUN: ${{ inputs.staging_run_id }}
        run: |
          printf 'Environment: %s\n\nCommit: %s\n\nStaging source run: %s\n' "$TARGET" "$RELEASE_SHA" "$STAGING_RUN" >> "$GITHUB_STEP_SUMMARY"
          echo 'Deployment events appear in the release step. Application logs remain in CloudWatch.' >> "$GITHUB_STEP_SUMMARY"
