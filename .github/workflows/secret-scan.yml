name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository content for credentials
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro"
          zricethezav/gitleaks:v8.21.2 detect --source=/repo --no-git
          --redact --exit-code=1
